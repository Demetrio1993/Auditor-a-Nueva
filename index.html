<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Auditoría Panamá</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* estilos.css - App de auditoría */
:root {
  --bg: #f4f6f9; --card: #ffffff; --tx: #1c2530; --mut: #5d6b7a; --lin: #d9dfe7;
  --pri: #1f3a5f; --pri2: #2f5d94; --ok: #1d7a46; --mal: #b3261e; --med: #a86a00; --flag: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161c; --card: #1a222b; --tx: #e6ebf1; --mut: #9aa8b6; --lin: #2d3946; --pri: #5f8fc9; --pri2: #7aa6dc; --ok: #4cc27f; --mal: #ff7b72; --med: #e0a63d; --flag: #3a3216; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 76px; }
.cab { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: var(--pri); color: #fff; }
@media (prefers-color-scheme: dark) { .cab { background: #1f3a5f; } }
.cab .ico { background: transparent; border: 0; color: #fff; font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; }
.tit-app { display: flex; flex-direction: column; min-width: 0; }
.tit-app b { font-size: 16px; }
.tit-app small { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pasos { position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 19; display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--lin); scrollbar-width: none; }
.pasos::-webkit-scrollbar { display: none; }
.paso { flex: 0 0 auto; border: 1px solid var(--lin); background: var(--card); color: var(--tx); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.paso.act { background: var(--pri); color: #fff; border-color: var(--pri); }
@media (prefers-color-scheme: dark) { .paso.act { color: #0c1218; } }
.pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--lin); vertical-align: middle; }
.pt.ok { background: var(--ok); } .pt.parcial { background: var(--med); } .pt.no { background: var(--mal); }
.pts .pt { margin: 0 2px 0 0; }
.vista { padding: 12px 16px; max-width: 980px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--lin); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card.sin-pad { padding: 0; overflow: hidden; }
h2 { font-size: 19px; margin: 0 0 6px; } h3 { font-size: 16px; margin: 0 0 8px; } h4 { font-size: 14px; margin: 14px 0 6px; color: var(--pri2); }
p { margin: 6px 0; } .mut { color: var(--mut); font-size: 13.5px; }
.okt { color: var(--ok); font-weight: 600; } .mal { color: var(--mal); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; border: 0; background: var(--pri); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; min-height: 44px; }
@media (prefers-color-scheme: dark) { .btn { color: #0c1218; } }
.btn.sec { background: transparent; color: var(--pri2); border: 1px solid var(--pri2); }
.btn.peligro { background: var(--mal); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .botones.col { flex-direction: column; } .botones.col .btn { width: 100%; }
.campo { display: block; margin: 10px 0; } .campo > span { display: block; font-size: 12.5px; color: var(--mut); margin-bottom: 3px; }
input, select, textarea { width: 100%; font: inherit; color: var(--tx); background: var(--bg); border: 1px solid var(--lin); border-radius: 8px; padding: 9px 10px; min-height: 40px; }
textarea { resize: vertical; }
input[type=checkbox] { width: 20px; height: 20px; min-height: 0; flex: 0 0 auto; margin-top: 2px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chk { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; font-size: 14.5px; }
.nota { margin: 0 0 6px 30px; width: calc(100% - 30px); font-size: 13px; min-height: 34px; padding: 6px 8px; }
.vals { list-style: none; margin: 10px 0 0; padding: 0; } .vals li { font-size: 13.5px; padding: 3px 0; } .vals li.ok { color: var(--ok); } .vals li.no { color: var(--mal); }
.fila-emp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--lin); border-radius: 10px; padding: 10px 12px; margin: 8px 0; color: var(--tx); font: inherit; cursor: pointer; }
.fila-emp small { color: var(--mut); grid-column: 1; } .fila-emp .pts, .fila-emp .chip, .fila-emp .sal { grid-column: 2; grid-row: 1; justify-self: end; } .fila-emp .sal { grid-row: 2; font-variant-numeric: tabular-nums; color: var(--mut); font-size: 13px; }
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
.est td { padding: 6px 4px; border-bottom: 1px solid var(--lin); font-size: 14px; } .est .num, .grid .num, .kv .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.est tr.tit td { font-weight: 700; color: var(--pri2); padding-top: 12px; } .est tr.tot td { font-weight: 700; border-top: 1px solid var(--tx); } .est tr.gran td { font-weight: 800; border-top: 1px solid var(--tx); border-bottom: 3px double var(--tx); }
.ecp td { white-space: nowrap; font-size: 13px; } .ecp td:first-child { white-space: normal; min-width: 150px; }
.enc-est { text-align: center; margin-bottom: 10px; line-height: 1.5; }
.grid th { background: var(--pri); color: #fff; font-size: 12px; font-weight: 600; padding: 7px 6px; text-align: left; white-space: nowrap; position: sticky; top: 0; }
@media (prefers-color-scheme: dark) { .grid th { color: #0c1218; } }
.grid td { padding: 3px 4px; border-bottom: 1px solid var(--lin); font-size: 13px; vertical-align: middle; }
.grid input.cel { width: 92px; text-align: right; padding: 6px; min-height: 34px; font-size: 13px; font-variant-numeric: tabular-nums; }
.grid input.cod { width: 108px; min-height: 34px; padding: 6px; font-size: 13px; } .grid input.nom { width: 190px; min-height: 34px; padding: 6px; font-size: 13px; } .grid select.rub { width: 150px; min-height: 34px; padding: 4px; font-size: 12.5px; }
.grid tfoot td { font-weight: 700; padding: 8px 4px; background: var(--bg); } .grid tfoot .mal { color: var(--mal); }
.grid.an td { padding: 6px; } .grid .lect { white-space: normal; min-width: 220px; color: var(--mut); font-size: 12.5px; } .grid tr.flag td { background: var(--flag); } .grid tr.grp td { font-weight: 700; color: var(--pri2); background: var(--bg); }
.x { background: transparent; border: 0; color: var(--mal); font-size: 16px; cursor: pointer; padding: 6px 8px; }
.kv td { padding: 6px 0; border-bottom: 1px solid var(--lin); font-size: 14px; } .kv tr.gran td { font-weight: 700; }
.linea { display: grid; grid-template-columns: 1fr 92px 92px 34px; gap: 6px; margin: 6px 0; align-items: center; } .linea input { text-align: right; padding: 8px 6px; }
.seg { display: flex; gap: 0; margin: 10px 0; border: 1px solid var(--pri2); border-radius: 10px; overflow: hidden; } .seg button { flex: 1; border: 0; background: transparent; color: var(--pri2); padding: 9px 4px; font: inherit; font-size: 13.5px; cursor: pointer; } .seg button.act { background: var(--pri2); color: #fff; }
@media (prefers-color-scheme: dark) { .seg button.act { color: #0c1218; } }
details.rub { background: var(--card); border: 1px solid var(--lin); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
details.rub > summary { list-style: none; display: grid; grid-template-columns: 38px 1fr auto; gap: 2px 8px; padding: 10px 12px; cursor: pointer; align-items: center; }
details.rub > summary::-webkit-details-marker { display: none; }
.ref { font-weight: 700; color: var(--pri2); } .nm { font-weight: 600; } .sal { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--mut); }
.bar { grid-column: 2; height: 5px; border-radius: 3px; background: var(--lin); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); }
.chip { justify-self: end; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--lin); color: var(--tx); white-space: nowrap; }
.c-razonable, .c-aceptado { background: #d7f0e0; color: #0f5a30; } .c-razonableconajustes { background: #dbe9fb; color: #17406f; } .c-consalvedad, .c-propuesto, .c-sinevidenciasuficiente { background: #fde9c4; color: #7a4d00; } .c-incorrecto, .c-noaceptado { background: #f9d6d3; color: #8a1b14; }
.cuerpo { padding: 0 12px 12px; }
.imp { margin-top: 10px; } .imp textarea { font-size: 13px; }
.aviso { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); background: #1c2530; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; max-width: 90%; z-index: 40; text-align: center; }
.aviso.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
.pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--lin); } .pie .btn { flex: 1; }
.pie:empty { display: none; }
@media (max-width: 480px) { .tres { grid-template-columns: 1fr 1fr 1fr; } .dos { grid-template-columns: 1fr; } .vista { padding: 10px 10px; } }
@media print {
  .noprint, .pasos, .cab, .pie, .aviso { display: none !important; }
  body { background: #fff; color: #000; padding: 0; font-size: 11pt; }
  .vista { max-width: none; padding: 0; } .card { border: 0; padding: 0 0 8px; break-inside: avoid-page; }
  details.rub { border: 0; } details.rub:not([open]) > .cuerpo { display: block; }
  textarea { border: 0; background: transparent; resize: none; overflow: visible; }
  .btn, .botones, .seg, .campo select, .campo input { display: none !important; }
}
details.al > summary { grid-template-columns: auto 1fr auto; }
.nv { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.n-alto { background: #f9d6d3; color: #8a1b14; } .n-medio { background: #fde9c4; color: #7a4d00; } .n-bajo { background: #dbe9fb; color: #17406f; }
.c-pendiente { background: var(--lin); } .c-sinproblema { background: #d7f0e0; color: #0f5a30; } .c-hallazgo { background: #f9d6d3; color: #8a1b14; }
.vers { border: 1px solid var(--lin); border-radius: 10px; padding: 10px 12px; margin: 10px 0; } .vers small { display: block; color: var(--mut); margin: 2px 0 4px; }
.carta textarea { font: 14px/1.5 Georgia, 'Times New Roman', serif; min-height: 300px; }
@media print { .carta textarea { font-size: 11pt; width: 100%; height: auto; } }
/* FIN DEL ARCHIVO estilos.css */

.cab .ico.txt { font-size: 15px; font-weight: 600; white-space: nowrap; padding: 8px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; }
.tit-btn { background: transparent; border: 0; color: #fff; text-align: left; font: inherit; cursor: pointer; padding: 0; flex: 1; }
.bloqueo { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
.bloq-caja { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.bloq-caja input { font-size: 24px; text-align: center; letter-spacing: 6px; padding: 10px; border: 1px solid var(--lin); border-radius: 10px; background: var(--bg); color: var(--tx); }

</style>
</head>
<body>
<header id="cab" class="cab noprint"></header>
<nav id="pasos" class="pasos noprint" aria-label="Módulos"></nav>
<main id="vista" class="vista"></main>
<footer id="pie" class="pie noprint"></footer>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script>
/* datos.js - Rubros, programa de pruebas y textos base de la app de auditoría */
'use strict';

/* Secciones de los estados financieros */
var SECCIONES = {
  AC:  { nombre: 'Activo corriente',        estado: 'BG', lado: 'A' },
  ANC: { nombre: 'Activo no corriente',     estado: 'BG', lado: 'A' },
  PC:  { nombre: 'Pasivo corriente',        estado: 'BG', lado: 'P' },
  PNC: { nombre: 'Pasivo no corriente',     estado: 'BG', lado: 'P' },
  PAT: { nombre: 'Patrimonio del propietario', estado: 'BG', lado: 'P' },
  ING: { nombre: 'Ingresos',                estado: 'ER' },
  COS: { nombre: 'Costo de ventas o servicios', estado: 'ER' },
  GOP: { nombre: 'Gastos de operación',     estado: 'ER' },
  GDP: { nombre: 'Depreciación',            estado: 'ER' },
  OIN: { nombre: 'Otros ingresos',          estado: 'ER' },
  GFI: { nombre: 'Gastos financieros',      estado: 'ER' },
  GIS: { nombre: 'Impuesto sobre la renta', estado: 'ER' }
};

/* Rubros: flujo = efectivo | op | inv | fin | dep (solo el gasto de depreciación) */
var RUBROS = [
  { id: 'EFE',  nombre: 'Efectivo y equivalentes',                 sec: 'AC',  flujo: 'efectivo' },
  { id: 'CXC',  nombre: 'Cuentas por cobrar clientes',             sec: 'AC',  flujo: 'op' },
  { id: 'OCC',  nombre: 'Otras cuentas por cobrar',                sec: 'AC',  flujo: 'op' },
  { id: 'INV',  nombre: 'Inventarios',                             sec: 'AC',  flujo: 'op' },
  { id: 'ANT',  nombre: 'Gastos pagados por anticipado',           sec: 'AC',  flujo: 'op' },
  { id: 'IMPA', nombre: 'Anticipos y créditos de impuestos',       sec: 'AC',  flujo: 'op' },
  { id: 'PPE',  nombre: 'Propiedad, planta y equipo (costo)',      sec: 'ANC', flujo: 'inv' },
  { id: 'DEPA', nombre: 'Depreciación acumulada',                  sec: 'ANC', flujo: 'inv' },
  { id: 'INT',  nombre: 'Activos intangibles',                     sec: 'ANC', flujo: 'inv' },
  { id: 'OANC', nombre: 'Otros activos no corrientes',             sec: 'ANC', flujo: 'inv' },
  { id: 'CXP',  nombre: 'Cuentas por pagar proveedores',           sec: 'PC',  flujo: 'op' },
  { id: 'ACR',  nombre: 'Gastos acumulados por pagar',             sec: 'PC',  flujo: 'op' },
  { id: 'LAB',  nombre: 'Obligaciones laborales y cargas sociales', sec: 'PC', flujo: 'op' },
  { id: 'IMPP', nombre: 'Impuestos por pagar',                     sec: 'PC',  flujo: 'op' },
  { id: 'PRC',  nombre: 'Préstamos a corto plazo',                 sec: 'PC',  flujo: 'fin' },
  { id: 'CXPP', nombre: 'Cuentas por pagar al propietario',        sec: 'PC',  flujo: 'fin' },
  { id: 'PRL',  nombre: 'Préstamos a largo plazo',                 sec: 'PNC', flujo: 'fin' },
  { id: 'CAP',  nombre: 'Capital del propietario',                 sec: 'PAT', flujo: 'fin' },
  { id: 'URE',  nombre: 'Utilidades retenidas',                    sec: 'PAT', flujo: 'fin' },
  { id: 'RET',  nombre: 'Retiros del propietario',                 sec: 'PAT', flujo: 'fin' },
  { id: 'ING',  nombre: 'Ingresos por servicios',                  sec: 'ING', flujo: 'er' },
  { id: 'COS',  nombre: 'Costo de ventas o servicios',             sec: 'COS', flujo: 'er' },
  { id: 'GOP',  nombre: 'Gastos de operación',                     sec: 'GOP', flujo: 'er' },
  { id: 'GDEP', nombre: 'Gasto de depreciación',                   sec: 'GDP', flujo: 'dep' },
  { id: 'OIN',  nombre: 'Otros ingresos',                          sec: 'OIN', flujo: 'er' },
  { id: 'GFI',  nombre: 'Gastos financieros',                      sec: 'GFI', flujo: 'er' },
  { id: 'GISR', nombre: 'Gasto de impuesto sobre la renta',        sec: 'GIS', flujo: 'er' }
];

var RUBRO_POR_ID = {};
RUBROS.forEach(function (r) { RUBRO_POR_ID[r.id] = r; });

var MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

/* Palabras clave para sugerir el rubro de una cuenta al importar */
var PISTAS_RUBRO = [
  ['EFE',  ['caja', 'banco', 'efectivo', 'cuenta corriente', 'cuenta de ahorro']],
  ['DEPA', ['depreciacion acumulada', 'depreciación acumulada', 'deprec. acum', 'dep. acum']],
  ['GDEP', ['gasto de depreciacion', 'gasto de depreciación', 'depreciacion del', 'depreciación del', 'amortizacion', 'amortización']],
  ['CXC',  ['cuentas por cobrar clientes', 'clientes', 'cuentas por cobrar comerciales']],
  ['OCC',  ['otras cuentas por cobrar', 'por cobrar', 'anticipo a empleados', 'prestamo a empleados']],
  ['INV',  ['inventario', 'mercancia', 'mercancía']],
  ['ANT',  ['pagado por anticipado', 'pagados por anticipado', 'seguro pagado', 'alquiler pagado']],
  ['IMPA', ['anticipo de impuesto', 'itbms por cobrar', 'credito fiscal', 'crédito fiscal', 'isr pagado', 'renta estimada']],
  ['PPE',  ['equipo', 'mobiliario', 'vehiculo', 'vehículo', 'edificio', 'terreno', 'maquinaria', 'propiedad']],
  ['INT',  ['intangible', 'software', 'licencia', 'marca']],
  ['CXP',  ['proveedores', 'cuentas por pagar comerciales', 'cuentas por pagar proveedores']],
  ['LAB',  ['seguro social', 'seguro educativo', 'decimo tercer', 'décimo tercer', 'vacaciones', 'prima de antiguedad', 'prima de antigüedad', 'prestaciones', 'salarios por pagar']],
  ['IMPP', ['isr por pagar', 'impuesto sobre la renta por pagar', 'itbms por pagar', 'impuestos por pagar']],
  ['ACR',  ['acumulad', 'por pagar']],
  ['PRC',  ['prestamo corto', 'préstamo corto', 'sobregiro', 'tarjeta de credito', 'tarjeta de crédito']],
  ['PRL',  ['prestamo largo', 'préstamo largo', 'hipoteca']],
  ['CXPP', ['propietario por pagar', 'cuenta con el propietario', 'cuenta del propietario']],
  ['RET',  ['retiro']],
  ['URE',  ['utilidades retenidas', 'utilidad retenida', 'resultados acumulados']],
  ['CAP',  ['capital', 'aporte']],
  ['COS',  ['costo de venta', 'costo de servicio', 'costo de ventas']],
  ['GISR', ['impuesto sobre la renta', 'gasto de isr']],
  ['GFI',  ['interes', 'interés', 'comision bancaria', 'comisión bancaria', 'gastos financieros']],
  ['OIN',  ['otros ingresos', 'ingreso financiero', 'ingresos financieros', 'ganancia']],
  ['ING',  ['ingreso', 'honorario', 'servicio prestado', 'ventas']],
  ['GOP',  ['gasto', 'salario', 'alquiler', 'honorarios profesionales', 'luz', 'agua', 'telefono', 'teléfono', 'internet', 'papeleria', 'papelería', 'combustible', 'mantenimiento', 'publicidad', 'viatico', 'viático']]
];

/* Programa de pruebas por rubro: objetivo, procedimientos, documentos e instrucciones */
var PROGRAMA = {
  EFE: {
    ref: 'A-1',
    objetivo: 'Comprobar que el efectivo y los depósitos existen, están completos, pertenecen al negocio y están bien medidos al cierre.',
    aserciones: 'Existencia, integridad, derechos, valuación',
    procedimientos: [
      'Obtener confirmación bancaria directa de todas las cuentas y préstamos, incluidas las que estén a nombre del propietario y se usen para el negocio',
      'Recalcular la conciliación bancaria de cada cuenta al cierre y seguir las partidas en tránsito hasta los estados de cuenta posteriores',
      'Hacer arqueo de caja sorpresivo, con acta firmada, y cotejarlo con el saldo en libros',
      'Probar el corte: cheques emitidos y depósitos de los últimos y primeros días',
      'Revisar transferencias o depósitos inusuales y confirmar que no mezclan gastos personales con los del negocio'
    ],
    documentos: ['Estados de cuenta del mes de cierre y del mes siguiente', 'Conciliaciones bancarias', 'Confirmación bancaria', 'Acta de arqueo de caja'],
    instrucciones: 'Anote saldo según banco, partidas conciliatorias y saldo en libros. Toda diferencia sin explicar mayor a la materialidad de ejecución se propone como ajuste.'
  },
  CXC: {
    ref: 'B-1',
    objetivo: 'Comprobar que los saldos de clientes existen, son cobrables y están bien cortados al cierre.',
    aserciones: 'Existencia, derechos, valuación, corte',
    procedimientos: [
      'Preparar la antigüedad de saldos y cotejarla con el mayor',
      'Confirmar por escrito los saldos de los clientes de mayor monto; donde no haya respuesta, aplicar procedimientos alternativos con cobros posteriores',
      'Revisar los cobros posteriores al cierre hasta la fecha de trabajo',
      'Evaluar la pérdida esperada o el deterioro de saldos vencidos',
      'Probar el corte de ingresos con las facturas y cobros de los últimos y primeros días'
    ],
    documentos: ['Antigüedad de saldos', 'Facturas fiscales emitidas', 'Estados de cuenta de clientes', 'Recibos y depósitos posteriores'],
    instrucciones: 'Registre saldo confirmado y diferencias por cliente. Los saldos sin respaldo ni cobro posterior se evalúan para provisión o salvedad.'
  },
  OCC: {
    ref: 'B-2',
    objetivo: 'Comprobar la naturaleza y recuperabilidad de otras cuentas por cobrar, incluidas las del propietario o de terceros.',

<script>
/* lock.js - Bloqueo opcional con PIN. Protege contra el acceso casual; no cifra los datos. */
var CLAVE_PIN = 'auditoria.pa.pin';
var LOCK = { pin: null, oculto: 0, espera: 120000 };

function pinLeer() {
  try { var t = localStorage.getItem(CLAVE_PIN); if (t) return JSON.parse(t); } catch (e) { /* sin almacenamiento */ }
  return null;
}
function pinHash(pin, sal) {
  var txt = sal + ':' + pin;
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function (b) {
      return [].map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  var h = 5381, i; for (i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
  return Promise.resolve('s' + h);
}
function pinGuardar(pin) {
  var sal = Math.random().toString(36).slice(2) + Date.now().toString(36);
  return pinHash(pin, sal).then(function (h) {
    try { localStorage.setItem(CLAVE_PIN, JSON.stringify({ sal: sal, hash: h })); } catch (e) { aviso('No se pudo guardar el PIN'); }
  });
}
function pinQuitar() { try { localStorage.removeItem(CLAVE_PIN); } catch (e) { /* nada */ } }

function cardPin() {
  var on = !!pinLeer();
  return '<section class="card"><h2>Privacidad</h2><p class="mut">Esta página es pública pero solo contiene el programa. Sus datos están únicamente en este teléfono. ' +
    (on ? 'El bloqueo con PIN está activo.' : 'Puede protegerla con un PIN de 4 a 8 dígitos.') + '</p><div class="botones">' +
    (on ? '<button class="btn sec" data-act="pinCambiar">Cambiar PIN</button><button class="btn sec" data-act="pinQuitar">Quitar PIN</button><button class="btn sec" data-act="pinBloquear">Bloquear ahora</button>'
        : '<button class="btn" data-act="pinCambiar">Activar PIN</button>') +
    '</div><p class="mut">El PIN evita que otra persona abra la app en su teléfono. No cifra los datos. Si lo olvida, solo se recupera borrando los datos de la app, por eso conviene tener un respaldo.</p></section>';
}

function bloquear() {
  if (!pinLeer()) return;
  var d = document.getElementById('bloqueo');
  if (!d) { d = document.createElement('div'); d.id = 'bloqueo'; d.className = 'bloqueo'; document.body.appendChild(d); }
  d.innerHTML = '<div class="bloq-caja"><h2>Auditoría Panamá</h2><p class="mut">Escriba su PIN para entrar.</p>' +
    '<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">' +
    '<div id="pinMsg" class="mal"></div><button class="btn" data-act="pinEntrar">Entrar</button>' +
    '<button class="btn sec" data-act="pinOlvido">Olvidé mi PIN</button></div>';
  d.style.display = 'flex';
  var i = document.getElementById('pinIn');
  i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') pinEntrar(); });
  setTimeout(function () { i.focus(); }, 50);
}
function desbloquear() { var d = document.getElementById('bloqueo'); if (d) d.style.display = 'none'; }
function pinEntrar() {
  var p = pinLeer(), v = document.getElementById('pinIn').value;
  if (!p) { desbloquear(); return; }
  pinHash(v, p.sal).then(function (h) {
    if (h === p.hash) desbloquear();
    else { document.getElementById('pinMsg').textContent = 'PIN incorrecto'; document.getElementById('pinIn').value = ''; }
  });
}

function clickLock(t, a) {
  if (a === 'pinEntrar') { pinEntrar(); return true; }
  if (a === 'pinBloquear') { bloquear(); return true; }
  if (a === 'pinOlvido') {
    if (confirm('Si no recuerda el PIN, la única forma de entrar es borrar todos los datos guardados en este teléfono. ¿Borrar todo?')) {
      try { localStorage.removeItem(CLAVE); localStorage.removeItem(CLAVE_PIN); } catch (e) { /* nada */ }
      location.reload();
    }
    return true;
  }
  if (a === 'pinQuitar') {
    var v = prompt('Escriba su PIN actual para quitarlo');
    var p = pinLeer();
    if (v == null || !p) return true;
    pinHash(v, p.sal).then(function (h) { if (h === p.hash) { pinQuitar(); render(); aviso('PIN quitado'); } else aviso('PIN incorrecto'); });
    return true;
  }
  if (a === 'pinCambiar') {
    var p2 = pinLeer(), ok = Promise.resolve(true);
    if (p2) {
      var act = prompt('Escriba su PIN actual');
      if (act == null) return true;
      ok = pinHash(act, p2.sal).then(function (h) { return h === p2.hash; });
    }
    ok.then(function (bien) {
      if (!bien) { aviso('PIN incorrecto'); return; }
      var n = prompt('Nuevo PIN (4 a 8 dígitos)');
      if (n == null) return;
      if (!/^\d{4,8}$/.test(n)) { aviso('El PIN debe tener de 4 a 8 dígitos'); return; }
      var c = prompt('Repita el nuevo PIN');
      if (c !== n) { aviso('Los PIN no coinciden'); return; }
      pinGuardar(n).then(function () { render(); aviso('PIN activado'); });
    });
    return true;
  }
  return false;
}

function bloqueoIniciar() {
  if (pinLeer()) bloquear();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) LOCK.oculto = Date.now();
    else if (LOCK.oculto && Date.now() - LOCK.oculto > LOCK.espera && pinLeer()) bloquear();
  });
}
/* FIN DEL ARCHIVO lock.js */

</script>

  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;

}
